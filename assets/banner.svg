<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filter for Shadow & Glow -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Dynamic CSS Keyframe Animations */
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -200; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    .ambient-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .ambient-glow-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
      transform-origin: 800px 220px;
    }
    .float-card-left {
      animation: floatSlow1 7s ease-in-out infinite;
      transform-origin: 100px 180px;
    }
    .float-card-right {
      animation: floatSlow2 8.5s ease-in-out infinite;
      transform-origin: 900px 150px;
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: dashCycle 15s linear infinite;
    }
    .grid-lines {
      opacity: 0.08;
    }
    .badge-pill {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g class="grid-lines" stroke="#94a3b8" stroke-width="0.8">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="220" x2="1000" y2="220"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="250" y1="0" x2="250" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
  </g>

  <!-- Animated Ambient Atmosphere Glows (Behind all content) -->
  <ellipse class="ambient-glow-1" cx="180" cy="90" rx="260" ry="180" fill="url(#glowIndigo)"/>
  <ellipse class="ambient-glow-2" cx="820" cy="220" rx="280" ry="190" fill="url(#glowCyan)"/>
  <ellipse cx="500" cy="20" rx="300" ry="120" fill="url(#glowPurple)"/>

  <!-- Dynamic Animated Circuit/Workflow Connector Lines (Positioned in sides/back) -->
  <g fill="none" stroke-linecap="round">
    <path class="flow-dash" d="M 50 170 Q 180 80 320 160" stroke="#818cf8" stroke-width="1.8" opacity="0.45"/>
    <path class="flow-dash" d="M 680 180 Q 820 280 950 170" stroke="#38bdf8" stroke-width="1.8" opacity="0.45"/>
    <path class="flow-dash" d="M 80 250 C 220 290 350 260 480 300" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Left Dynamic Accent Card (Kanban Sprint Node - Non-obstructive) -->
  <g class="float-card-left" filter="url(#shadowFilter)">
    <rect x="35" y="80" width="165" height="150" rx="10" fill="url(#cardGrad1)" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
    <rect x="50" y="98" width="55" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="50" y="112" width="135" height="8" rx="4" fill="#cbd5e1" opacity="0.7"/>
    <rect x="50" y="128" width="100" height="7" rx="3.5" fill="#64748b" opacity="0.5"/>
    <!-- Status tags -->
    <rect x="50" y="152" width="60" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8"/>
    <text x="80" y="164" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">IN PROGRESS</text>
    <!-- Progress bar -->
    <rect x="50" y="190" width="135" height="5" rx="2.5" fill="#334155"/>
    <rect x="50" y="190" width="95" height="5" rx="2.5" fill="#818cf8"/>
  </g>

  <!-- Right Dynamic Accent Card (Work Management Metric - Non-obstructive) -->
  <g class="float-card-right" filter="url(#shadowFilter)">
    <rect x="800" y="90" width="165" height="145" rx="10" fill="url(#cardGrad1)" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
    <rect x="815" y="108" width="60" height="6" rx="3" fill="#c084fc" opacity="0.8"/>
    <rect x="815" y="122" width="135" height="8" rx="4" fill="#cbd5e1" opacity="0.7"/>
    <rect x="815" y="138" width="90" height="7" rx="3.5" fill="#64748b" opacity="0.5"/>
    <!-- Mini Metric Graph -->
    <path d="M 815 195 L 840 180 L 865 186 L 895 168 L 925 174 L 950 155" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="950" cy="155" r="3.5" fill="#38bdf8"/>
    <rect x="815" y="210" width="45" height="14" rx="7" fill="#6366f1" fill-opacity="0.25"/>
    <text x="837" y="220" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">+38% VELOCITY</text>
  </g>

  <!-- Top Decorative Header Tag (Foreground) -->
  <g filter="url(#shadowFilter)">
    <rect x="390" y="32" width="220" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="406" cy="45" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="506" y="49" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">
      CURATED ECOSYSTEM DIRECTORY
    </text>
  </g>

  <!-- FOREGROUND HERO TITLE (Crystal Clear, High Contrast, Prominent) -->
  <!-- Subtle backplate for pristine contrast and legibility -->
  <rect x="180" y="65" width="640" height="165" rx="14" fill="#0b1120" fill-opacity="0.65" filter="url(#shadowFilter)"/>

  <text x="500" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    Collaborative Work Management
  </text>
  
  <text x="500" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Enterprise Work OS Suites • Visual Kanban • Self-Hosted Open-Source Workspaces
  </text>

  <!-- Value Feature Pills (Arranged in Crisp Row in Foreground) -->
  <g transform="translate(205, 175)">
    <!-- Pill 1 -->
    <g class="badge-pill">
      <rect x="0" y="0" width="136" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="75" y="19" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Task Orchestration</text>
    </g>
    <!-- Pill 2 -->
    <g class="badge-pill" transform="translate(146, 0)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4" fill="#818cf8"/>
      <text x="72" y="19" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Visual Planning</text>
    </g>
    <!-- Pill 3 -->
    <g class="badge-pill" transform="translate(286, 0)">
      <rect x="0" y="0" width="146" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4" fill="#c084fc"/>
      <text x="80" y="19" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Self-Hosted Stacks</text>
    </g>
    <!-- Pill 4 -->
    <g class="badge-pill" transform="translate(442, 0)">
      <rect x="0" y="0" width="148" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4" fill="#34d399"/>
      <text x="82" y="19" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sovereign Data</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(280, 260)">
    <rect x="0" y="0" width="440" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="220" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">
      ⚡ <tspan fill="#38bdf8" font-weight="700">10+ Top SaaS</tspan> &amp; <tspan fill="#a855f7" font-weight="700">17+ Open-Source Projects</tspan> Ranked &amp; Compared
    </text>
  </g>

  <!-- Modern Glowing Outer Border -->
  <rect x="1" y="1" width="998" height="338" rx="15" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5" opacity="0.6"/>
</svg>
